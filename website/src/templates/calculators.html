<div class="wrap page-head">
  <nav class="crumbs" aria-label="{{a:nav.breadcrumb}}"><ol><li><a href="{{LINK:home}}">{{t:nav.home}}</a></li><li aria-current="page">{{t:nav.calculators}}</li></ol></nav>
  <h1>{{t:calc.hub.title}}</h1>
  <p class="lead">{{t:calc.hub.lead}}</p>
</div>
<section class="wrap calc-hub" aria-labelledby="calc-list-title">
  <h2 id="calc-list-title" class="sr-only">{{t:calc.hub.all}}</h2>
  <ul class="dest">
{{CALC_CARDS}}
  </ul>
  <aside class="framed today calc-today" aria-labelledby="today-title">
    <h2 id="today-title">{{t:home.today.title}}</h2>
    {{TODAY_SERVER}}
  </aside>
  <p class="calc-trust"><svg class="ic" aria-hidden="true"><use href="#i-shield-check"/></svg><span>{{t:calc.hub.verified}}</span></p>
</section>
