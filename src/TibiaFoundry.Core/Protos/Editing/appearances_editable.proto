// Editable form of the client's appearances file, used by the Assets Editor (Tibia Foundry 5.0).
//
// Field numbers and nesting are those of appearances.proto, with three differences that let an
// unchanged file be written back byte for byte:
//   * proto2, so a value the client stores explicitly (even false or 0) is written back, and a value
//     it leaves out stays out;
//   * enum fields are int32, so values this schema does not know are kept as they are;
//   * text fields are bytes, because the client stores Latin-1 text, not UTF-8.
// Fields added by a future client are kept as unknown fields and written back unchanged.
syntax = "proto2";

package tibiafoundry.editing;

option csharp_namespace = "TibiaFoundry.Core.Editing.Model";

message EditableAppearances {
  repeated EditableAppearance object = 1;
  repeated EditableAppearance outfit = 2;
  repeated EditableAppearance effect = 3;
  repeated EditableAppearance missile = 4;
  optional SpecialMeaningIds special_meaning_appearance_ids = 5;
}

message SpritePhase {
  optional uint32 duration_min = 1;
  optional uint32 duration_max = 2;
}

message SpriteAnimation {
  optional uint32 default_start_phase = 1;
  optional bool synchronized = 2;
  optional bool random_start_phase = 3;
  // ANIMATION_LOOP_TYPE: 0 infinite, -1 ping-pong, 1 counted.
  optional int32 loop_type = 4;
  optional uint32 loop_count = 5;
  repeated SpritePhase sprite_phase = 6;
}

message Box {
  optional uint32 x = 1;
  optional uint32 y = 2;
  optional uint32 width = 3;
  optional uint32 height = 4;
}

message SpriteInfo {
  optional uint32 pattern_width = 1;
  optional uint32 pattern_height = 2;
  optional uint32 pattern_depth = 3;
  optional uint32 layers = 4;
  repeated uint32 sprite_id = 5;
  optional SpriteAnimation animation = 6;
  optional uint32 bounding_square = 7;
  optional bool is_opaque = 8;
  repeated Box bounding_box_per_direction = 9;
}

message FrameGroup {
  // FIXED_FRAME_GROUP: 0 outfit idle, 1 outfit moving, 2 object initial.
  optional int32 fixed_frame_group = 1;
  optional uint32 id = 2;
  optional SpriteInfo sprite_info = 3;
}

message EditableAppearance {
  optional uint32 id = 1;
  repeated FrameGroup frame_group = 2;
  optional AppearanceFlags flags = 3;
  optional bytes name = 4;
  optional bytes description = 5;
}

message AppearanceFlags {
  optional FlagBank bank = 1;
  optional bool clip = 2;
  optional bool bottom = 3;
  optional bool top = 4;
  optional bool container = 5;
  optional bool cumulative = 6;
  optional bool usable = 7;
  optional bool forceuse = 8;
  optional bool multiuse = 9;
  optional FlagWrite write = 10;
  optional FlagWriteOnce write_once = 11;
  optional bool liquidpool = 12;
  optional bool unpass = 13;
  optional bool unmove = 14;
  optional bool unsight = 15;
  optional bool avoid = 16;
  optional bool no_movement_animation = 17;
  optional bool take = 18;
  optional bool liquidcontainer = 19;
  optional bool hang = 20;
  optional FlagHook hook = 21;
  optional bool rotate = 22;
  optional FlagLight light = 23;
  optional bool dont_hide = 24;
  optional bool translucent = 25;
  optional FlagShift shift = 26;
  optional FlagHeight height = 27;
  optional bool lying_object = 28;
  optional bool animate_always = 29;
  optional FlagAutomap automap = 30;
  optional FlagLenshelp lenshelp = 31;
  optional bool fullbank = 32;
  optional bool ignore_look = 33;
  optional FlagClothes clothes = 34;
  optional FlagDefaultAction default_action = 35;
  optional FlagMarket market = 36;
  optional bool wrap = 37;
  optional bool unwrap = 38;
  optional bool topeffect = 39;
  repeated FlagNpcSale npcsaledata = 40;
  optional FlagChangedToExpire changedtoexpire = 41;
  optional bool corpse = 42;
  optional bool player_corpse = 43;
  optional FlagCyclopedia cyclopediaitem = 44;
  optional bool ammo = 45;
  optional bool show_off_socket = 46;
  optional bool reportable = 47;
  optional FlagUpgradeClassification upgradeclassification = 48;
  optional bool reverse_addons_east = 49;
  optional bool reverse_addons_west = 50;
  optional bool reverse_addons_south = 51;
  optional bool reverse_addons_north = 52;
  optional bool wearout = 53;
  optional bool clockexpire = 54;
  optional bool expire = 55;
  optional bool expirestop = 56;
  optional bool deco_item_kit = 57;
  optional FlagSkillWheelGem skillwheel_gem = 58;
  optional bool dual_wielding = 59;
  optional FlagImbueable imbueable = 60;
  optional FlagProficiency proficiency = 61;
  // VOCATION values.
  repeated int32 restrict_to_vocation = 62;
  optional uint32 minimum_level = 63;
  // WEAPON_TYPE value.
  optional int32 weapon_type = 64;
}

message FlagBank { optional uint32 waypoints = 1; }
message FlagWrite { optional uint32 max_text_length = 1; }
message FlagWriteOnce { optional uint32 max_text_length_once = 1; }
message FlagLight {
  optional uint32 brightness = 1;
  optional uint32 color = 2;
}
message FlagHeight { optional uint32 elevation = 1; }
message FlagShift {
  optional uint32 x = 1;
  optional uint32 y = 2;
}
message FlagClothes { optional uint32 slot = 1; }
// PLAYER_ACTION value.
message FlagDefaultAction { optional int32 action = 1; }
message FlagMarket {
  // ITEM_CATEGORY value.
  optional int32 category = 1;
  optional uint32 trade_as_object_id = 2;
  optional uint32 show_as_object_id = 3;
  // Older clients kept the vocation and level restrictions here; current ones use the
  // flags 62 and 63. Read as a fallback only.
  repeated int32 restrict_to_vocation = 5;
  optional uint32 minimum_level = 6;
}
message FlagNpcSale {
  optional bytes name = 1;
  optional bytes location = 2;
  optional uint32 sale_price = 3;
  optional uint32 buy_price = 4;
  optional uint32 currency_object_type_id = 5;
  optional bytes currency_quest_flag_display_name = 6;
}
message FlagAutomap { optional uint32 color = 1; }
// HOOK_TYPE value.
message FlagHook { optional int32 direction = 1; }
message FlagLenshelp { optional uint32 id = 1; }
message FlagChangedToExpire { optional uint32 former_object_typeid = 1; }
message FlagCyclopedia { optional uint32 cyclopedia_type = 1; }
message FlagUpgradeClassification { optional uint32 upgrade_classification = 1; }
message FlagSkillWheelGem {
  optional uint32 gem_quality_id = 1;
  optional uint32 vocation_id = 2;
}
message FlagImbueable { optional uint32 slot_count = 1; }
message FlagProficiency { optional uint32 proficiency_id = 1; }

message SpecialMeaningIds {
  optional uint32 gold_coin_id = 1;
  optional uint32 platinum_coin_id = 2;
  optional uint32 crystal_coin_id = 3;
  optional uint32 tibia_coin_id = 4;
  optional uint32 stamped_letter_id = 5;
  optional uint32 supply_stash_id = 6;
  optional uint32 standard_reward_chest_id = 7;
  optional uint32 blank_imbuement_scroll_id = 8;
}
